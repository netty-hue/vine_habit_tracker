<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titre %}Vine Habit{% endblock %}</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
    
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-purple-50 text-gray-800 antialiased font-sans">

    <div class="flex h-screen overflow-hidden">

        <aside id="sidebar" class="w-64 bg-gradient-to-b from-purple-900 to-purple-700 text-white flex flex-col shadow-2xl transition-all duration-300 flex-shrink-0">
            <div class="px-4 py-4 border-b border-purple-600/50 flex flex-col items-center justify-center bg-white/5">
                <img src="{{ url_for('static', filename='image/vine habit.png') }}" alt="Vine Logo" class="w-24 h-24 object-contain rounded-full bg-white p-1 shadow-inner mb-2">
                <h1 class="text-xl font-black tracking-wider text-purple-100">Vine Habit</h1>
            </div>

            <nav class="flex-1 px-4 py-6 space-y-2">
                <a href="{{ url_for('main.home') }}" class="flex items-center gap-4 px-4 py-3 rounded-xl font-medium hover:bg-white/10 transition-all duration-200 text-purple-100 hover:text-white">
                    <i data-lucide="home" class="w-5 h-5"></i> Accueil
                </a>
                <a href="{{ url_for('main.goal') }}" class="flex items-center gap-4 px-4 py-3 rounded-xl font-medium hover:bg-white/10 transition-all duration-200 text-purple-100 hover:text-white">
                    <i data-lucide="target" class="w-5 h-5"></i> Objectifs
                </a>
                <a href="{{ url_for('main.dashboard') }}" class="flex items-center gap-4 px-4 py-3 rounded-xl font-medium hover:bg-white/10 transition-all duration-200 text-purple-100 hover:text-white">
                    <i data-lucide="bar-chart-3" class="w-5 h-5"></i> Tableau de bord
                </a>
                <a href="{{ url_for('main.settings') }}" class="flex items-center gap-4 px-4 py-3 rounded-xl font-medium hover:bg-white/10 transition-all duration-200 text-purple-100 hover:text-white">
                    <i data-lucide="settings" class="w-5 h-5"></i> Paramètres
                </a>
            </nav>

            <div class="px-4 pb-6">
                <a href="{{ url_for('main.logout') }}" class="flex items-center justify-center gap-2 w-full bg-purple-600/40 hover:bg-red-600 py-3 rounded-xl font-semibold shadow-lg transition duration-200 text-sm">
                    <i data-lucide="log-out" class="w-4 h-4"></i> Déconnexion
                </a>
            </div>
        </aside>

        <main id="content" class="flex-1 overflow-y-auto p-8 transition-all duration-300">
            
            <div class="max-w-5xl mx-auto mb-6 flex items-center gap-4">
                <button id="toggleSidebar" class="bg-white rounded-xl shadow-md p-3 text-purple-700 hover:bg-purple-100 transition flex items-center justify-center">
                    <i data-lucide="menu" class="w-5 h-5"></i>
                </button>
                
                <div class="flex-1">
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="rounded-xl bg-green-50 border border-green-200 text-green-700 px-4 py-2 flex items-center gap-2 text-sm shadow-sm">
                                    <i data-lucide="check-circle" class="w-4 h-4 text-green-500"></i>
                                    {{ message }}
                                </div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}
                </div>
            </div>

            <div class="max-w-5xl mx-auto">
                {% block content %}{% endblock %}
            </div>
        </main>

    </div>

    <script>
        lucide.createIcons();

        const sidebar = document.getElementById("sidebar");
        const toggle = document.getElementById("toggleSidebar");

        toggle.addEventListener("click", function () {
            sidebar.classList.toggle("hidden");
        });
    </script>
</body>
</html>
