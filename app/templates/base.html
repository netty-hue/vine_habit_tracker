<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block titre %}Vine Habit{% endblock %}</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FullCalendar -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body id="body" class="bg-purple-100 overflow-hidden">

    <div class="flex h-screen">

        <!-- Sidebar -->

        <aside id="sidebar"
            class="w-72 bg-gradient-to-b from-purple-800 to-purple-600 text-white flex flex-col shadow-2xl transition-all duration-300 flex-shrink-0">

            <!-- Logo -->

            <div class="px-8 py-8 border-b border-purple-500">

                <h1 class="text-4xl font-extrabold tracking-wide">
                    <i class="fa-solid fa-leaf"></i> Vine Habit

                </h1>

            </div>

            <!-- Navigation -->

            <nav class="flex-1 px-5 py-8 space-y-4">

                <a href="{{ url_for('main.home') }}"
                    class="flex items-center px-5 py-4 rounded-2xl text-xl font-semibold hover:bg-white hover:text-purple-700 transition-all duration-200">

                    <i class="fa-solid fa-house-circle-exclamation"></i> Home
                </a>

                <a href="{{ url_for('main.goal') }}"
                    class="flex items-center px-5 py-4 rounded-2xl text-xl font-semibold hover:bg-white hover:text-purple-700 transition-all duration-200">

                    <i class="fa-solid fa-target"></i> Goal

                </a>

                <a href="{{ url_for('main.dashboard') }}"
                    class="flex items-center px-5 py-4 rounded-2xl text-xl font-semibold hover:bg-white hover:text-purple-700 transition-all duration-200">

                    <i class="fa-solid fa-chart-bar"></i> Dashboard

                </a>

                <a href="{{ url_for('main.settings') }}"
                    class="flex items-center px-5 py-4 rounded-2xl text-xl font-semibold hover:bg-white hover:text-purple-700 transition-all duration-200">

                    <i class="fa-solid fa-gear"></i> Settings

                </a>

            </nav>

            <!-- Déconnexion -->

            <div class="px-5 pb-6">

                <a href="{{ url_for('main.logout') }}"
                    class="block text-center bg-purple-200 hover:bg-purple-200 py-4 rounded-2xl text-xl font-bold shadow-lg transition">

                    Déconnexion

                </a>

            </div>

        </aside>

        <!-- Contenu -->

        <main id="content" class="flex-1 overflow-auto bg-purple-100 transition-all duration-300">

            <div class="p-6">

                <!-- Bouton Menu -->

                <button id="toggleSidebar"
                    class="bg-white rounded-xl shadow-lg w-12 h-12 text-2xl hover:bg-gray-100 transition">

                    ☰

                </button>

                {% with messages = get_flashed_messages(with_categories=true) %}

                {% if messages %}

                {% for category, message in messages %}

                <div class="mt-5 mb-5 rounded-xl bg-green-100 text-green-700 p-4">

                    {{ message }}

                </div>

                {% endfor %}

                {% endif %}

                {% endwith %}

                {% block content %}
                {% endblock %}

            </div>

        </main>

    </div>

    <script>

        const sidebar = document.getElementById("sidebar");
        const content = document.getElementById("content");
        const toggle = document.getElementById("toggleSidebar");

        toggle.addEventListener("click", function () {

            if (sidebar.classList.contains("hidden")) {

                sidebar.classList.remove("hidden");
                content.classList.remove("w-full");

            } else {

                sidebar.classList.add("hidden");
                content.classList.add("w-full");

            }

        });

    </script>

</body>

</html>
