<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titre %}Vine Habit{% endblock %}</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-purple-50 text-gray-800 antialiased font-sans">

    <!-- Overlay mobile -->
    <div id="sidebarOverlay"
        class="fixed inset-0 bg-black/40 z-40 hidden lg:hidden transition-opacity duration-300">
    </div>

    <div class="flex h-screen overflow-hidden">

        <!-- ================= Sidebar ================= -->

        <aside id="sidebar"
            class="fixed lg:static inset-y-0 left-0 z-50 w-64 bg-gradient-to-b from-purple-900 to-purple-700 text-white flex flex-col shadow-2xl transform -translate-x-full lg:translate-x-0 transition-transform duration-300">

            <!-- Logo -->
            <div
                class="px-4 py-5 border-b border-purple-600/50 flex flex-col items-center bg-white/5">

                <img
                    src="{{ url_for('static', filename='image/vine habit.png') }}"
                    class="w-24 h-24 rounded-full bg-white p-1 shadow-inner object-contain mb-3">

                <h1 class="text-xl font-black tracking-wider">
                    Vine Habit
                </h1>

            </div>

            <!-- Navigation -->

            <nav class="flex-1 px-4 py-6 space-y-2">

                <a href="{{ url_for('main.home') }}"
                    class="flex items-center gap-4 px-4 py-3 rounded-xl hover:bg-white/10 transition">

                    <i data-lucide="home" class="w-5 h-5"></i>

                    Accueil

                </a>

                <a href="{{ url_for('main.goal') }}"
                    class="flex items-center gap-4 px-4 py-3 rounded-xl hover:bg-white/10 transition">

                    <i data-lucide="target" class="w-5 h-5"></i>

                    Objectifs

                </a>

                <a href="{{ url_for('main.dashboard') }}"
                    class="flex items-center gap-4 px-4 py-3 rounded-xl hover:bg-white/10 transition">

                    <i data-lucide="bar-chart-3" class="w-5 h-5"></i>

                    Tableau de bord

                </a>

                <a href="{{ url_for('main.settings') }}"
                    class="flex items-center gap-4 px-4 py-3 rounded-xl hover:bg-white/10 transition">

                    <i data-lucide="settings" class="w-5 h-5"></i>

                    Paramètres

                </a>

            </nav>

            <!-- Déconnexion -->

            <div class="px-4 pb-6">

                <a href="{{ url_for('main.logout') }}"
                    class="flex justify-center items-center gap-2 bg-purple-600/40 hover:bg-red-600 py-3 rounded-xl font-semibold transition">

                    <i data-lucide="log-out" class="w-4 h-4"></i>

                    Déconnexion

                </a>

            </div>

        </aside>

        <!-- ================= Contenu ================= -->

        <div class="flex-1 flex flex-col overflow-hidden">

            <!-- HEADER -->

            <header
                class="h-16 bg-white shadow-sm border-b border-purple-100 flex items-center justify-between px-6 sticky top-0 z-30">

                <div class="flex items-center gap-4">

                    <!-- Hamburger -->
                    <button id="toggleSidebar"
                        class="p-2 rounded-lg hover:bg-purple-100 transition">

                        <i data-lucide="menu"
                            class="w-6 h-6 text-purple-700"></i>

                    </button>

                    <h2 class="text-xl font-bold text-purple-700">
                        Vine Habit
                    </h2>

                </div>

                <!-- Tu pourras mettre le profil ici -->
                <div class="flex items-center gap-3">

                </div>

            </header>

            <!-- MAIN -->

            <main
                id="content"
                class="flex-1 overflow-y-auto p-4 sm:p-8">

                <!-- Messages Flash -->

                <div class="max-w-5xl mx-auto mt-6">

                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}

                                <div class="mb-4 rounded-xl bg-green-50 border border-green-200 text-green-700 px-4 py-3 flex items-center gap-2 shadow-sm">

                                    <i data-lucide="check-circle"
                                        class="w-5 h-5 text-green-500"></i>

                                    <span>{{ message }}</span>

                                </div>

                            {% endfor %}
                        {% endif %}
                    {% endwith %}

                </div>


                <!-- Contenu des pages -->

                <div class="max-w-5xl mx-auto">

                    {% block content %}
                    {% endblock %}

                </div>

            </main>

        </div>

    </div>

        <script>
        // Initialisation des icônes Lucide
        lucide.createIcons();

        const sidebar = document.getElementById("sidebar");
        const toggle = document.getElementById("toggleSidebar");
        const overlay = document.getElementById("sidebarOverlay");

        let sidebarDesktopVisible = true;

        function toggleMenu() {

            const isDesktop = window.innerWidth >= 1024;

            if (isDesktop) {

                // Sur PC
                if (sidebarDesktopVisible) {

                    sidebar.classList.add("lg:-translate-x-full");
                    sidebar.classList.add("lg:absolute");

                } else {

                    sidebar.classList.remove("lg:-translate-x-full");
                    sidebar.classList.remove("lg:absolute");

                }

                sidebarDesktopVisible = !sidebarDesktopVisible;

            } else {

                // Mobile
                sidebar.classList.toggle("-translate-x-full");
                overlay.classList.toggle("hidden");

            }

        }

        function closeMobileMenu() {

            if (window.innerWidth < 1024) {

                sidebar.classList.add("-translate-x-full");
                overlay.classList.add("hidden");

            }

        }

        toggle.addEventListener("click", toggleMenu);

        overlay.addEventListener("click", closeMobileMenu);

        window.addEventListener("resize", () => {

            if (window.innerWidth >= 1024) {

                overlay.classList.add("hidden");

                sidebar.classList.remove("-translate-x-full");

            } else {

                sidebar.classList.add("-translate-x-full");

            }

        });

    </script>

</body>
</html>
