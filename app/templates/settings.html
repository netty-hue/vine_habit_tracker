{% extends "base.html" %}

{% block titre %}Paramètres{% endblock %}

{% block content %}

<div class="max-w-3xl mx-auto py-10">

    <div class="bg-white rounded-3xl shadow-xl p-10">

        <h1 class="text-4xl font-bold text-purple-700 mb-2">
            Paramètres
        </h1>

        <p class="text-gray-500 mb-10">
            Modifiez les informations de votre compte.
        </p>

        <form method="POST">

            <!-- Nom -->

            <div class="mb-6">

                <label class="block mb-2 font-semibold text-purple-50/60">
                    Nom
                </label>

                <input
                    type="text"
                    name="nom"
                    value="{{ current_user.nom }}"
                    class="w-full border rounded-xl px-5 py-3 focus:ring-2 focus:ring-purple-500 outline-none">

            </div>

            <!-- Email -->

            <div class="mb-6">

                <label class="block mb-2 font-semibold text-purple-50/60">
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    value="{{ current_user.email }}"
                    class="w-full border rounded-xl px-5 py-3 focus:ring-2 focus:ring-purple-500 outline-none">

            </div>

            <hr class="my-8">

            <h2 class="text-2xl font-semibold text-purple-50/60 mb-6">
                Modifier le mot de passe
            </h2>

            <!-- Ancien mot de passe -->

            <div class="mb-6">

                <label class="block mb-2 font-semibold text-purple-50/60">
                    Ancien mot de passe
                </label>

                <input
                    type="password"
                    name="ancien_password"
                    class="w-full border rounded-xl px-5 py-3 focus:ring-2 focus:ring-purple-500 outline-none">

            </div>

            <!-- Nouveau -->

            <div class="mb-6">

                <label class="block mb-2 font-semibold text-purple-50/60">
                    Nouveau mot de passe
                </label>

                <input
                    type="password"
                    name="nouveau_password"
                    class="w-full border rounded-xl px-5 py-3 focus:ring-2 focus:ring-purple-500 outline-none">

            </div>

            <!-- Confirmation -->

            <div class="mb-8">

                <label class="block mb-2 font-semibold text-purple-50/60">
                    Confirmer le nouveau mot de passe
                </label>

                <input
                    type="password"
                    name="confirmation_password"
                    class="w-full border rounded-xl px-5 py-3 focus:ring-2 focus:ring-purple-500 outline-none">

            </div>

            <!-- Boutons -->

            <div class="flex justify-end gap-4">

                <a href="{{ url_for('main.home') }}"
                   class="px-6 py-3 border rounded-xl hover:bg-gray-100">

                    Annuler

                </a>

                <button
                    type="submit"
                    class="bg-purple-600 hover:bg-purple-700 text-white px-8 py-3 rounded-xl transition">

                    Enregistrer

                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
